# Builds and attaches release artifacts when a v* tag is pushed.
# The release is created as a draft: publishing stays a human decision.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: verify
        run: |
          go vet ./...
          go test ./...
      - name: build artifacts
        run: scripts/build-release.sh "${GITHUB_REF_NAME#v}" "$GITHUB_SHA"
      - name: create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "griglia $GITHUB_REF_NAME" \
            --generate-notes \
            dist/*.tar.gz dist/*.zip dist/checksums.txt
